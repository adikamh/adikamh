<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1b1440"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff700"/>
      <stop offset="60%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff002b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff00e4"/>
      <stop offset="100%" stop-color="#ff00e4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="220" fill="url(#bg)"/>

  <!-- scanlines -->
  <g opacity="0.08">
    <rect x="0" y="0" width="900" height="220" fill="url(#bg)"/>
  </g>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="80" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="150" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="60" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="170" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="100" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="60" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="150" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="35" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="120" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="1.3"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- target on the right, gets destroyed -->
  <g transform="translate(830,110)">
    <polygon points="0,-14 12,10 -12,10" fill="none" stroke="#ff2b6e" stroke-width="2" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;1;0;0;0;1" keyTimes="0;0.55;0.6;0.62;0.9;0.95;1" dur="3.4s" repeatCount="indefinite"/>
    </polygon>
    <circle r="0" fill="url(#boom)">
      <animate attributeName="r" values="0;0;0;40;0;0;0" keyTimes="0;0.55;0.6;0.66;0.7;0.95;1" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.55;0.6;0.66;0.7;0.95;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- rocket group flying left to right and back -->
  <g>
    <animateMotion path="M 40,110 L 800,110 L 40,110" keyPoints="0;0.5;1" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite" rotate="0"/>
    <g id="rocket">
      <!-- flame -->
      <ellipse cx="-22" cy="0" rx="14" ry="6" fill="url(#flame)">
        <animate attributeName="rx" values="14;20;14" dur="0.18s" repeatCount="indefinite"/>
      </ellipse>
      <!-- body -->
      <g filter="url(#glow)">
        <polygon points="-16,0 4,-9 26,0 4,9" fill="url(#rocketBody)"/>
        <polygon points="26,0 34,0 26,-4" fill="#ff00e4"/>
        <polygon points="26,0 34,0 26,4" fill="#ff00e4"/>
        <circle cx="8" cy="0" r="3.4" fill="#0d1117"/>
      </g>
    </g>
  </g>

  <!-- laser bolts fired from rocket, timed with forward pass -->
  <g stroke="#39ff14" stroke-width="3" filter="url(#glow)" stroke-linecap="round">
    <line x1="0" y1="0" x2="26" y2="0">
      <animateMotion path="M 66,110 L 860,110" begin="0.15s" dur="0.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" begin="0.15s" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="26" y2="0">
      <animateMotion path="M 66,110 L 860,110" begin="0.55s" dur="0.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" begin="0.55s" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="26" y2="0">
      <animateMotion path="M 66,110 L 860,110" begin="0.95s" dur="0.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" begin="0.95s" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- footer text -->
  <text x="450" y="205" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#4facfe" opacity="0.85">
    &gt;_ FIRING_SEQUENCE_ACTIVE // TARGET_LOCKED // NET_CITY
  </text>
</svg>
